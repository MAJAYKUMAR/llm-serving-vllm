apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serving
  labels:
    app: llm-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-serving
  template:
    metadata:
      labels:
        app: llm-serving
    spec:
      containers:
        - name: llm-serving
          # Replace with your registry image, e.g. ghcr.io/MAJAYKUMAR/llm-serving-vllm:latest
          image: llm-serving-vllm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: LOAD_MODEL_ON_STARTUP
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              # Uncomment for GPU nodes (and set a matching nodeSelector /
              # toleration for your GPU node pool):
              # nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              # nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
